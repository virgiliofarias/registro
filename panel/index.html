<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04080F">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ENLACE PANEL">
<meta name="robots" content="noindex,nofollow">
<title>ENLACE PANEL</title>
<script>
// Panel del dueño (10 nov). iPhone/iPad: sin manifest, para que el ícono guarde el link completo con ?p= (con manifest iOS abre la página sin el link).
(function(){var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(!ios)document.write('<link rel="manifest" href="manifest.webmanifest">');})();
</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#04080F;overflow:hidden}
iframe{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;bottom:0;border:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px))}
#m{color:#fff;font:17px system-ui,sans-serif;padding:28px;line-height:1.5}
#sp{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#04080F;color:#fff;font:600 22px system-ui,sans-serif;letter-spacing:.3em;transition:opacity .4s}
#sp i{width:46px;height:46px;border-radius:50%;border:4px solid rgba(56,225,255,.25);border-top-color:#38E1FF;animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style></head><body>
<div id="sp"><i></i>ENLACE PANEL</div>
<script>
(function(){
  // 26 nov 2026: el Panel ya NO se abre dentro de script.google.com (con varias cuentas de Google en el teléfono, Google
  // mostraba "No se puede abrir el archivo"). Ahora esta página pide el Panel a Enlace (cuenta de Jarvis) SIN cookies de Google
  // y lo dibuja aquí; las llamadas google.script.run viajan por POST, también sin cookies. Así abre con cualquier cuenta.
  var BASE='https://script.google.com/macros/s/AKfycbwaSoPoTUe3akwfU9uQ7awfCmj2XQ9NR5MEc8Luk85Ve42TZYY93M1nnIhoLYebYGLkoQ/exec';
  var q=new URLSearchParams(location.search), t=q.get('p'), K='enlace_panel';
  try{ if(t) localStorage.setItem(K,t); else t=localStorage.getItem(K); }catch(e){}
  if(!t){
    document.getElementById('sp').remove();
    document.body.innerHTML='<div id="m">Falta tu clave del Panel. Borra este ícono, abre otra vez el link que te pasó Claude y vuelve a instalarlo.</div>';
    return;
  }
  if(!q.get('p')){ try{ history.replaceState(null,'','?p='+encodeURIComponent(t)); }catch(e){} }
  var sp=document.getElementById('sp'), quita=function(){ if(sp){sp.style.opacity=0; setTimeout(function(){sp&&sp.remove();sp=null},450);} };
  var f=document.createElement('iframe');
  f.allow='geolocation *; camera *; clipboard-write *';
  f.setAttribute('allowfullscreen','');
  // Puente: google.script.run → POST a Enlace sin cookies.
  var PUENTE='<script>(function(){var B='+JSON.stringify(BASE)+';'+
    'function corre(){var ok=function(){},ko=function(){};var p=new Proxy({},{get:function(_,n){'+
    'if(n==="withSuccessHandler")return function(fn){ok=fn;return p};'+
    'if(n==="withFailureHandler")return function(fn){ko=fn;return p};'+
    'if(n==="withUserObject")return function(){return p};'+
    'return function(){var a=[].slice.call(arguments);fetch(B,{method:"POST",credentials:"omit",body:JSON.stringify({fn:n,args:a})})'+
    '.then(function(r){return r.json()}).then(function(j){if(j.ok)ok(j.data);else ko(new Error(j.error))})'+
    '.catch(function(e){ko(new Error("Sin conexión con Enlace: "+e.message))})}}});return p}'+
    'window.google={script:{get run(){return corre()}}};})();<\/script>';
  function falla(m){ quita(); document.body.innerHTML='<div id="m">No pude abrir el Panel ('+String(m).replace(/</g,'&lt;').slice(0,160)+'). Revisa tu señal y vuelve a abrirlo.</div>'; }
  fetch(BASE+'?panelhtml='+encodeURIComponent(t),{credentials:'omit'}).then(function(r){return r.text()}).then(function(h){
    if(h.indexOf('panelApi')<0) throw new Error(/no v.lido/i.test(h)?'link del Panel no válido':'Enlace no respondió');
    h=h.replace(/<head>/i,'<head>'+PUENTE);
    f.onload=function(){ setTimeout(quita,600) };
    f.srcdoc=h;
  }).catch(function(e){ falla(e.message||e); });
  setTimeout(quita,15000);
  document.body.appendChild(f);
})();
</script></body></html>
