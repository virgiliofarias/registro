<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Salud</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b2f35">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{color-scheme:light;--bg:#e9eaec;--surface:#fbfbfc;--btn:linear-gradient(180deg,#ffffff,#e3e5e8);--line:#c9ccd1;--grid:#e6e7ea;
 --text:#17191c;--text2:#4a4e55;--muted:#868a92;--series:#2a78d6;--band:rgba(12,163,12,.10);--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--head:#2b2f35}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#141517;--surface:#1d1f22;--btn:linear-gradient(180deg,#2c2f34,#212327);--line:#3a3d43;--grid:#2a2c30;
 --text:#eef0f2;--text2:#c2c6cc;--muted:#8d9198;--series:#3987e5;--band:rgba(12,163,12,.16);--head:#0d0e10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{background:var(--head);color:#f2f3f5;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px;flex:1}
.top .sub{font-size:12px;color:#aeb3ba}
.back{border:0;background:#454a52;color:#fff;font-size:22px;width:42px;height:42px;border-radius:12px}
main{padding:14px;max-width:720px;margin:0 auto}
.alert{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--crit);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.big{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:18px;padding:16px 12px;min-height:118px;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.big:active{transform:translateY(1px)}
.big .ic{font-size:30px;line-height:1}
.big .t{font-weight:700;font-size:16px;margin-top:6px}
.big .s{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 4px;font-size:17px}
.note{font-size:13px;color:var(--muted)}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:7px 4px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{color:var(--text2);font-weight:500;font-size:13px}
.list button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;text-align:left}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 8px}
svg text{font-size:10px;fill:var(--text2)}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:3}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin:0 0 14px}
.tl .it:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--series)}
.tl .d{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:12px;padding:14px 8px;font:inherit;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
label{display:block;font-size:13px;color:var(--text2);margin:10px 0 4px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}
.save{width:100%;margin-top:14px;border:0;background:var(--series);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:14px}
.ok{color:var(--good);font-weight:600;margin-top:8px}
.src{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.src:last-child{border:0}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root,:root{color-scheme:dark;--bg:#04070d;--surface:linear-gradient(160deg,rgba(56,225,255,.09),rgba(56,225,255,.03));--btn:linear-gradient(160deg,rgba(56,225,255,.12),rgba(76,141,255,.04));--line:rgba(56,225,255,.32);--grid:rgba(56,225,255,.12);
 --text:#e4f7ff;--text2:#9cc4d8;--muted:#6d8da2;--series:#38E1FF;--band:rgba(75,227,160,.10);--good:#4BE3A0;--warn:#FFC857;--crit:#FF6B81;--head:rgba(4,7,13,.72)}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif;font-size:14.5px}
#red{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.top{background:var(--head);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-family:Orbitron,sans-serif;letter-spacing:.12em;font-size:18px;color:#bff4ff;text-shadow:0 0 12px rgba(56,225,255,.6)}
.top .sub{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.back{background:rgba(56,225,255,.12);border:1px solid var(--line);color:var(--series)}
.card,.alert,.big,.list button,.seg button{position:relative;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.card h2,.big .t,.grp{font-family:Rajdhani,sans-serif;letter-spacing:.04em}
.card h2{font-size:18px;color:#cdf6ff}
.card:before,.big:before{content:"";position:absolute;inset:-1px;border-radius:6px;pointer-events:none;
 background:linear-gradient(var(--series),var(--series)) top left/14px 2px,linear-gradient(var(--series),var(--series)) top left/2px 14px,
 linear-gradient(var(--series),var(--series)) bottom right/14px 2px,linear-gradient(var(--series),var(--series)) bottom right/2px 14px;background-repeat:no-repeat;opacity:.9}
.big{background:var(--btn);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 18px rgba(56,225,255,.06) inset}
.big .t{font-size:17px;color:#d8f8ff}
.big .ic{filter:drop-shadow(0 0 6px rgba(56,225,255,.5))}
.alert{background:linear-gradient(160deg,rgba(255,107,129,.12),rgba(255,107,129,.03));border:1px solid rgba(255,107,129,.45);border-left:3px solid var(--crit);border-radius:6px}
.tag{background:rgba(4,7,13,.6);border-color:var(--line);font-family:"JetBrains Mono",monospace;font-size:11px}
td,th{border-bottom:1px solid var(--grid)}
td b,.big .s{font-family:"JetBrains Mono",monospace}
.list button,.seg button{background:var(--btn);border:1px solid var(--line);color:var(--text);border-radius:6px}
.seg button.on{background:rgba(56,225,255,.85);color:#02121a;box-shadow:0 0 14px rgba(56,225,255,.5)}
input{background:rgba(4,7,13,.7);border:1px solid var(--line);color:var(--text);border-radius:6px}
.save{background:linear-gradient(90deg,#1aa7d6,#38E1FF);color:#02121a;border-radius:6px;box-shadow:0 0 16px rgba(56,225,255,.4)}
.tip{background:#02121a;color:#bff4ff;border:1px solid var(--line)}
.tl .it:before{box-shadow:0 0 8px var(--series)}
@media (prefers-reduced-motion:reduce){#red{display:none}}
</style></head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function descifrar(clave){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(CIF.s),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(CIF.i)},k,b64(CIF.c))))}
async function intentar(clave,guardar){const m=document.getElementById("msgc");if(m)m.textContent="Abriendo…";
 try{const D=await descifrar(clave.trim().toUpperCase());if(guardar){try{localStorage.setItem("misalud-clave",clave.trim().toUpperCase())}catch(e){}}new Function("D",D.code)(D.data)}
 catch(e){if(m)m.textContent="Clave incorrecta.";try{localStorage.removeItem("misalud-clave")}catch(e){}}}
document.getElementById("abrir").onclick=()=>intentar(document.getElementById("clave").value,document.getElementById("recordar").checked);
(()=>{const h=decodeURIComponent((location.hash||"").slice(1));if(/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/i.test(h)){history.replaceState(null,"",location.pathname);intentar(h,true);return}let g=null;try{g=localStorage.getItem("misalud-clave")}catch(e){}if(g)intentar(g,false)})();
